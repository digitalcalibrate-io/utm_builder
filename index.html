<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UTM Builder – Calibrate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f5f4f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;}
    .header-bar{background:#1a1a1a;padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo-text{font-size:1.4rem;font-weight:900;color:#E8501B;letter-spacing:-0.04em;line-height:1;}
    .logo-sub{font-size:0.58rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.12em;margin-top:1px;}
    .badge-tool{font-size:0.7rem;font-weight:700;color:#E8501B;border:1.5px solid #E8501B;padding:0.2rem 0.6rem;border-radius:4px;text-transform:uppercase;letter-spacing:0.08em;}
    .page{max-width:860px;margin:0 auto;padding:2rem 1rem 3rem;}
    input,select{font-family:inherit;outline:none;}
    input:focus,select:focus{box-shadow:0 0 0 2px #E8501B;border-color:transparent!important;}
    .inp{width:100%;border:1.5px solid #e2e0dc;border-radius:8px;padding:0.55rem 0.75rem;font-size:0.82rem;color:#1a1a1a;background:white;}
    .inp.warn{border-color:#f59e0b!important;}
    .btn-orange{background:#E8501B;color:white;border:none;border-radius:7px;padding:0.4rem 0.875rem;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 0.15s;}
    .btn-orange:hover{background:#d4451a;}
    .btn-orange:disabled{opacity:0.35;cursor:not-allowed;}
    .btn-outline{background:transparent;color:#E8501B;border:1.5px solid #E8501B;border-radius:7px;padding:0.35rem 0.875rem;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s;}
    .btn-outline:disabled{opacity:0.35;cursor:not-allowed;}
    .btn-outline:hover:not(:disabled){background:#fff0e8;}
    .tab-btn{padding:0.5rem 1.25rem;font-size:0.82rem;font-weight:700;border:none;cursor:pointer;background:transparent;border-bottom:2px solid transparent;font-family:inherit;transition:all 0.15s;}
    .tab-btn.active{color:#E8501B;border-bottom-color:#E8501B;}
    .tab-btn.inactive{color:#aaa;}
    .card{background:white;border-radius:12px;border:1.5px solid #e8e6e2;overflow:hidden;margin-bottom:0.75rem;}
    .label{display:block;font-size:0.62rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.3rem;}
    .param-row{display:flex;align-items:center;padding:0.5rem 1rem;border-bottom:1px solid #f5f4f2;}
    .param-row:last-child{border-bottom:none;}
    .footer{text-align:center;margin-top:2rem;font-size:0.7rem;color:#bbb;}
    .footer span{color:#E8501B;font-weight:900;}
    .empty-state{text-align:center;padding:2rem;color:#aaa;font-size:0.875rem;}
    .url-box{background:#f5f4f2;border-radius:8px;padding:0.75rem;word-break:break-all;font-family:monospace;font-size:0.75rem;color:#1a1a1a;line-height:1.6;}
    .ga4-badge{font-size:0.65rem;background:#E8501B;color:white;padding:0.15rem 0.6rem;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
    .warn-box{display:flex;align-items:flex-start;gap:0.5rem;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:0.65rem 0.75rem;margin-top:0.5rem;}
    .warn-box p{font-size:0.75rem;color:#92400e;line-height:1.5;}
    .info-box{display:flex;align-items:flex-start;gap:0.5rem;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:0.65rem 0.75rem;margin-top:0.5rem;}
    .info-box p{font-size:0.75rem;color:#9a3412;line-height:1.5;}
    .sanitize-note{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:0.35rem 0.6rem;font-size:0.7rem;color:#92400e;margin-top:0.3rem;}
    .batch-table{width:100%;border-collapse:collapse;}
    .batch-th{padding:0.4rem 0.5rem;text-align:left;font-size:0.58rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1.5px solid #f0ede9;white-space:nowrap;background:#f0ede9;}
    .batch-td{padding:0.4rem 0.5rem;border-bottom:1px solid #f5f4f2;vertical-align:middle;}
    .batch-tr:last-child .batch-td{border-bottom:none;}
    .batch-tr:hover .batch-td{background:#fafaf9;}
    .url-preview{font-family:monospace;font-size:0.68rem;color:#555;word-break:break-all;line-height:1.4;}
    .url-preview.empty{color:#bbb;}
    .remove-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:1.1rem;line-height:1;padding:0.2rem 0.3rem;}
    .remove-btn:hover{color:#dc2626;}
    .add-row-btn{width:100%;padding:0.75rem;background:transparent;color:#E8501B;border:2px dashed #E8501B;border-radius:10px;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:0.75rem;}
    .add-row-btn:hover{background:#fff0e8;}
    .sheets-note{background:#fff0e8;border:1px solid #fdd0b8;border-radius:8px;padding:0.55rem 0.75rem;font-size:0.72rem;color:#9a3412;margin-top:0.5rem;}
  </style>
</head>
<body>
<div class="header-bar">
  <div><div class="logo-text">calibrate</div><div class="logo-sub">part of iO</div></div>
  <div class="badge-tool">UTM Builder</div>
</div>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const O = "#E8501B";

// ─── SANITIZE ────────────────────────────────────────────────────────────────
// Never æøå or spaces in UTM params – replace with URL-safe equivalents
function sanitize(str) {
  return (str || "")
    .toLowerCase()
    .replace(/æ/g, "ae")
    .replace(/ø/g, "oe")
    .replace(/å/g, "aa")
    .replace(/\s+/g, "_")
    .replace(/[^a-z0-9_\-.]/g, "");
}

function hasInvalidChars(str) {
  return /[æøåÆØÅ\s]/.test(str);
}

const PLATFORMS = [
  {group:"Paid Social",id:"meta",label:"Meta · Paid Social",source:"meta",medium:"paid_social",extraParams:{platform:"{{site_source_name}}",placement:"{{placement}}"},dynamicNote:"Indsæt URL'en i Meta's 'URL Parameters' felt – Meta udfylder platform og placement automatisk per annonce",ga4Channel:"Paid Social",ga4Fix:"Tilføj 'meta' til Paid Social regel i GA4: source matches regex ^(fb|ig|an|facebook|instagram|meta)$"},
  {group:"Paid Social",id:"linkedin",label:"LinkedIn · Paid Social",source:"linkedin",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Social",id:"tiktok",label:"TikTok · Paid Social",source:"tiktok",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Social",id:"pinterest",label:"Pinterest · Paid Social",source:"pinterest",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Social",id:"snapchat",label:"Snapchat · Paid Social",source:"snapchat",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Social",id:"twitter",label:"X (Twitter) · Paid Social",source:"twitter",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Social",id:"reddit",label:"Reddit · Paid Social",source:"reddit",medium:"paid_social",ga4Channel:"Paid Social"},
  {group:"Paid Search",id:"bing",label:"Microsoft Ads · CPC",source:"bing",medium:"cpc",ga4Channel:"Paid Search"},
  {group:"Display",id:"dv360",label:"DV360 · Display",source:"dv360",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"adform",label:"Adform · Display",source:"adform",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"adnami",label:"Adnami · Display",source:"adnami",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"amazon_display",label:"Amazon · Display",source:"amazon",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"targeted_display",label:"Targeted · Display",source:"targeted",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"tv2_display",label:"TV2 · Display",source:"tv2",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"tv2play_display",label:"TV2 Play · Display",source:"tv2play",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"tv2sport_display",label:"TV2 Sport · Display",source:"tv2sport",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"eb_display",label:"Ekstra Bladet · Display",source:"eb",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"bt_display",label:"BT · Display",source:"bt",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"politiken_display",label:"Politiken · Display",source:"politiken",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"berlingske_display",label:"Berlingske · Display",source:"berlingske",medium:"display",ga4Channel:"Display"},
  {group:"Display",id:"dba_display",label:"DBA · Display",source:"dba",medium:"display",ga4Channel:"Display"},
  {group:"Native",id:"strossle",label:"Strossle · Native",source:"strossle",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"outbrain",label:"Outbrain · Native",source:"outbrain",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"taboola",label:"Taboola · Native",source:"taboola",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"concept",label:"Concept Media · Native",source:"concept",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"tv2_native",label:"TV2 · Native",source:"tv2",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"tv2play_native",label:"TV2 Play · Native",source:"tv2play",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"eb_native",label:"Ekstra Bladet · Native",source:"eb",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"bt_native",label:"BT · Native",source:"bt",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Native",id:"dba_native",label:"DBA · Native",source:"dba",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},
  {group:"Paid Video",id:"youtube",label:"YouTube · Paid Video",source:"youtube",medium:"paid_video",ga4Channel:"Paid Video"},
  {group:"Paid Video",id:"tv2_video",label:"TV2 · Paid Video",source:"tv2",medium:"paid_video",ga4Channel:"Paid Video"},
  {group:"Paid Video",id:"eb_video",label:"Ekstra Bladet · Paid Video",source:"eb",medium:"paid_video",ga4Channel:"Paid Video"},
  {group:"Paid Video",id:"showheros",label:"ShowHeroes · Paid Video",source:"showheros",medium:"paid_video",ga4Channel:"Paid Video"},
  {group:"Audio",id:"spotify",label:"Spotify · Audio",source:"spotify",medium:"audio",ga4Channel:"Audio",ga4Fix:"Custom channel group nødvendig: medium exactly matches audio"},
  {group:"Audio",id:"podcast",label:"Podcast · Audio",source:"podcast",medium:"audio",ga4Channel:"Audio",ga4Fix:"Custom channel group nødvendig: medium exactly matches audio"},
  {group:"Email",id:"klaviyo",label:"Klaviyo · Email",source:"klaviyo",medium:"email",ga4Channel:"Email"},
  {group:"Email",id:"hubspot",label:"HubSpot · Email",source:"hubspot",medium:"email",ga4Channel:"Email"},
  {group:"Email",id:"activecampaign",label:"ActiveCampaign · Email",source:"activecampaign",medium:"email",ga4Channel:"Email"},
  {group:"Email",id:"newsletter",label:"Nyhedsbrev · Email",source:"newsletter",medium:"email",ga4Channel:"Email"},
  {group:"Offline",id:"qr",label:"QR-kode · Offline",source:"qr",medium:"offline",ga4Channel:"Offline",ga4Fix:"Custom channel group nødvendig: medium exactly matches offline"},
  {group:"Offline",id:"ooh",label:"OOH / DOOH · Offline",source:"ooh",medium:"offline",ga4Channel:"Offline",ga4Fix:"Custom channel group nødvendig: medium exactly matches offline"},
];

const GROUPS = {};
PLATFORMS.forEach(p=>{if(!GROUPS[p.group])GROUPS[p.group]=[];GROUPS[p.group].push(p);});

function buildUrl(baseUrl, platform, campaign, content, term) {
  if (!baseUrl || !platform) return "";
  try {
    const clean = baseUrl.trim();
    const sep = clean.includes("?")?"&":"?";
    const params = {utm_source:platform.source, utm_medium:platform.medium};
    if (campaign) params.utm_campaign = sanitize(campaign);
    if (content)  params.utm_content  = sanitize(content);
    if (term)     params.utm_term     = sanitize(term);
    if (platform.extraParams) Object.assign(params, platform.extraParams);
    const str = Object.entries(params)
      .map(([k,v]) => v && v.includes("{{") ? `${k}=${v}` : `${k}=${encodeURIComponent(v)}`)
      .join("&");
    return clean + sep + str;
  } catch { return baseUrl; }
}

function PlatformSelect({value, onChange, style}) {
  return (
    <select className="inp" value={value} onChange={e=>onChange(e.target.value)} style={style}>
      {Object.entries(GROUPS).map(([group,items])=>(
        <optgroup key={group} label={group}>
          {items.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
        </optgroup>
      ))}
    </select>
  );
}

// Field with sanitize-on-change + warning if invalid chars detected
function SanitizedInput({value, onChange, placeholder, style, className}) {
  const warn = hasInvalidChars(value);
  return (
    <div>
      <input
        className={`inp${warn?" warn":""}${className?" "+className:""}`}
        type="text"
        value={value}
        style={style}
        placeholder={placeholder}
        onChange={e => onChange(sanitize(e.target.value))}
      />
      {warn && (
        <div className="sanitize-note">
          æ→ae · ø→oe · å→aa · mellemrum→_ (URL-tegn erstattes automatisk)
        </div>
      )}
    </div>
  );
}

// ─── SINGLE MODE ─────────────────────────────────────────────────────────────
function SingleMode() {
  const [url,        setUrl]        = useState("");
  const [platformId, setPlatformId] = useState("meta");
  const [campaign,   setCampaign]   = useState("");
  const [content,    setContent]    = useState("");
  const [term,       setTerm]       = useState("");
  const [copiedUrl,  setCopiedUrl]  = useState(false);
  const [copiedSheet,setCopiedSheet]= useState(false);

  const platform = PLATFORMS.find(p=>p.id===platformId);
  const finalUrl = useMemo(()=>buildUrl(url,platform,campaign,content,term),[url,platform,campaign,content,term]);
  const hasOutput = url.trim().length>0 && platform;

  const utmParams = useMemo(()=>{
    if(!platform) return {};
    const p={utm_source:platform.source,utm_medium:platform.medium};
    if(campaign) p.utm_campaign=sanitize(campaign);
    if(content)  p.utm_content=sanitize(content);
    if(term)     p.utm_term=sanitize(term);
    if(platform.extraParams) Object.assign(p,platform.extraParams);
    return p;
  },[platform,campaign,content,term]);

  const handlePlatformChange=(id)=>{setPlatformId(id);setCampaign("");setContent("");setTerm("");};

  const copyUrl=()=>{
    if(!finalUrl)return;
    navigator.clipboard.writeText(finalUrl).then(()=>{setCopiedUrl(true);setTimeout(()=>setCopiedUrl(false),2000);});
  };

  const copyForSheet=()=>{
    if(!finalUrl)return;
    const row=[url.trim(),platform.label,platform.source,platform.medium,sanitize(campaign),sanitize(content),sanitize(term),finalUrl].join("\t");
    navigator.clipboard.writeText(row).then(()=>{setCopiedSheet(true);setTimeout(()=>setCopiedSheet(false),2500);});
  };

  return (
    <div>
      <div className="card">
        <div style={{padding:"1.25rem"}}>
          <div style={{marginBottom:"1rem"}}>
            <label className="label">Landing Page URL</label>
            <input className="inp" type="text" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://www.harald-nyborg.dk/haven"/>
          </div>
          <div style={{marginBottom:"1rem"}}>
            <label className="label">Platform</label>
            <PlatformSelect value={platformId} onChange={handlePlatformChange}/>
          </div>
          <div style={{marginBottom:"0.75rem"}}>
            <label className="label">Kampagnenavn</label>
            <SanitizedInput value={campaign} onChange={setCampaign} placeholder="e.g. sommerkampagne_2025"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem"}}>
            <div>
              <label className="label">Content</label>
              <SanitizedInput value={content} onChange={setContent} placeholder="e.g. banner_v1"/>
            </div>
            <div>
              <label className="label">Term</label>
              <SanitizedInput value={term} onChange={setTerm} placeholder="e.g. keyword"/>
            </div>
          </div>
        </div>
      </div>

      {hasOutput&&<>
        <div className="card" style={{padding:"1rem"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.625rem",flexWrap:"wrap",gap:"0.5rem"}}>
            <span style={{fontSize:"0.65rem",fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:"0.08em"}}>Genereret URL</span>
            <div style={{display:"flex",gap:"0.4rem"}}>
              <button className="btn-outline" onClick={copyForSheet}>
                {copiedSheet?"✓ Klar til Sheets!":"📋 Kopiér til Sheets"}
              </button>
              <button className="btn-orange" onClick={copyUrl}
                style={{background:copiedUrl?"#dcfce7":O,color:copiedUrl?"#16a34a":"white"}}>
                {copiedUrl?"✓ Kopieret!":"Kopiér URL"}
              </button>
            </div>
          </div>
          <div className="url-box">{finalUrl}</div>
          {copiedSheet&&<div className="sheets-note">Paste med <strong>Ctrl+V</strong> / <strong>Cmd+V</strong> direkte i Google Sheets eller Excel – én kolonne per felt.</div>}
        </div>

        <div className="card" style={{overflow:"hidden",marginBottom:"0.75rem"}}>
          <div style={{padding:"0.5rem 1rem",background:"#f5f4f2",borderBottom:"1px solid #f0ede9"}}>
            <span style={{fontSize:"0.65rem",fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:"0.08em"}}>Parametre</span>
          </div>
          {Object.entries(utmParams).map(([key,value])=>{
            const isDynamic=value&&value.includes("{{");
            const isExtra=platform?.extraParams&&key in platform.extraParams;
            return (
              <div key={key} className="param-row">
                <span style={{fontFamily:"monospace",fontSize:"0.75rem",width:"9rem",flexShrink:0,color:isExtra?"#aaa":O}}>{key}</span>
                <span style={{fontFamily:"monospace",fontSize:"0.75rem",color:isDynamic?"#f59e0b":"#1a1a1a"}}>{value}</span>
                {isDynamic&&<span style={{marginLeft:"0.5rem",fontSize:"0.62rem",background:"#fffbeb",color:"#f59e0b",border:"1px solid #fde68a",padding:"0.1rem 0.35rem",borderRadius:"3px",fontWeight:700}}>auto</span>}
              </div>
            );
          })}
        </div>

        <div className="card" style={{padding:"1rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:(platform.dynamicNote||platform.ga4Fix)?"0.625rem":0}}>
            <span className="ga4-badge">GA4</span>
            <span style={{fontSize:"0.875rem",color:"#1a1a1a",fontWeight:500}}>{platform.ga4Channel}</span>
          </div>
          {platform.dynamicNote&&<div className="warn-box"><span style={{color:"#f59e0b",flexShrink:0}}>⚡</span><p>{platform.dynamicNote}</p></div>}
          {platform.ga4Fix&&<div className="info-box"><span style={{color:"#f97316",flexShrink:0}}>⚠</span><p>{platform.ga4Fix}</p></div>}
        </div>
      </>}

      {!hasOutput&&(
        <div className="card" style={{border:"1.5px dashed #e8e6e2"}}>
          <div className="empty-state">Indtast en URL for at generere dit UTM-link</div>
        </div>
      )}
    </div>
  );
}

// ─── BATCH MODE ───────────────────────────────────────────────────────────────
let batchId=1;
function newBatchRow(pid="meta"){return {id:batchId++,platformId:pid,url:"",campaign:"",content:"",term:""};}

function BatchMode() {
  const [rows,       setRows]       = useState([newBatchRow("meta"),newBatchRow("linkedin"),newBatchRow("tiktok")]);
  const [copiedAll,  setCopiedAll]  = useState(false);
  const [downloaded, setDownloaded] = useState(false);

  const updRow=(id,f,v)=>setRows(prev=>prev.map(r=>r.id===id?{...r,[f]:v}:r));
  const remRow=(id)=>setRows(prev=>prev.filter(r=>r.id!==id));
  const addRow=()=>setRows(prev=>[...prev,newBatchRow("meta")]);

  const builtRows=useMemo(()=>rows.map(r=>{
    const p=PLATFORMS.find(x=>x.id===r.platformId);
    return {...r,platform:p,finalUrl:buildUrl(r.url,p,r.campaign,r.content,r.term)};
  }),[rows]);

  const validRows=builtRows.filter(r=>r.url&&r.finalUrl);

  const copyAllForSheets=()=>{
    const header="Landing Page URL\tPlatform\tutm_source\tutm_medium\tutm_campaign\tutm_content\tutm_term\tGenereret URL";
    const dataRows=builtRows.map(r=>{
      if(!r.url||!r.platform)return null;
      return [r.url,r.platform.label,r.platform.source,r.platform.medium,sanitize(r.campaign),sanitize(r.content),sanitize(r.term),r.finalUrl].join("\t");
    }).filter(Boolean);
    navigator.clipboard.writeText([header,...dataRows].join("\n")).then(()=>{setCopiedAll(true);setTimeout(()=>setCopiedAll(false),2500);});
  };

  const downloadCsv=()=>{
    const header="Landing Page URL,Platform,utm_source,utm_medium,utm_campaign,utm_content,utm_term,Genereret URL";
    const dataRows=builtRows.map(r=>{
      if(!r.url||!r.platform)return null;
      return [r.url,r.platform.label,r.platform.source,r.platform.medium,sanitize(r.campaign),sanitize(r.content),sanitize(r.term),r.finalUrl]
        .map(v=>`"${(v||"").replace(/"/g,'""')}"`)
        .join(",");
    }).filter(Boolean);
    const csv=[header,...dataRows].join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="utm-links.csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    setDownloaded(true);setTimeout(()=>setDownloaded(false),2000);
  };

  const copySingle=(finalUrl)=>navigator.clipboard.writeText(finalUrl);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.75rem",flexWrap:"wrap",gap:"0.5rem"}}>
        <p style={{fontSize:"0.8rem",color:"#888"}}>{validRows.length} af {rows.length} links klar</p>
        <div style={{display:"flex",gap:"0.4rem"}}>
          <button className="btn-outline" onClick={copyAllForSheets} disabled={validRows.length===0}>
            {copiedAll?"✓ Klar til Sheets!":"📋 Kopiér alle til Sheets"}
          </button>
          <button className="btn-orange" onClick={downloadCsv} disabled={validRows.length===0}
            style={{background:downloaded?"#dcfce7":O,color:downloaded?"#16a34a":"white"}}>
            {downloaded?"✓ Downloadet!":"⬇ Download CSV"}
          </button>
        </div>
      </div>

      {copiedAll&&<div className="sheets-note" style={{marginBottom:"0.75rem"}}>Paste med <strong>Ctrl+V</strong> / <strong>Cmd+V</strong> direkte i Google Sheets eller Excel – kolonner mapper automatisk med header-rækken.</div>}

      <div className="card">
        <div style={{overflowX:"auto"}}>
          <table className="batch-table">
            <thead>
              <tr>
                <th className="batch-th">Landing Page URL</th>
                <th className="batch-th">Platform</th>
                <th className="batch-th">Kampagnenavn</th>
                <th className="batch-th">Content</th>
                <th className="batch-th">Term</th>
                <th className="batch-th" style={{width:"28px"}}></th>
              </tr>
            </thead>
            <tbody>
              {builtRows.map(row=>(
                <React.Fragment key={row.id}>
                  <tr className="batch-tr">
                    <td className="batch-td">
                      <input className="inp" type="text" value={row.url}
                        onChange={e=>updRow(row.id,"url",e.target.value)}
                        placeholder="https://..." style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/>
                    </td>
                    <td className="batch-td">
                      <PlatformSelect value={row.platformId} onChange={v=>updRow(row.id,"platformId",v)}
                        style={{fontSize:"0.75rem",padding:"0.38rem 0.55rem"}}/>
                    </td>
                    <td className="batch-td">
                      <input className={`inp${hasInvalidChars(row.campaign)?" warn":""}`} type="text" value={row.campaign}
                        onChange={e=>updRow(row.id,"campaign",sanitize(e.target.value))}
                        placeholder="sommerkampagne" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/>
                    </td>
                    <td className="batch-td">
                      <input className={`inp${hasInvalidChars(row.content)?" warn":""}`} type="text" value={row.content}
                        onChange={e=>updRow(row.id,"content",sanitize(e.target.value))}
                        placeholder="banner_v1" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/>
                    </td>
                    <td className="batch-td">
                      <input className={`inp${hasInvalidChars(row.term)?" warn":""}`} type="text" value={row.term}
                        onChange={e=>updRow(row.id,"term",sanitize(e.target.value))}
                        placeholder="keyword" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/>
                    </td>
                    <td className="batch-td">
                      <button className="remove-btn" onClick={()=>remRow(row.id)}>×</button>
                    </td>
                  </tr>
                  {row.url&&(
                    <tr className="batch-tr">
                      <td className="batch-td" colSpan={5} style={{paddingTop:"0.2rem",paddingBottom:"0.5rem"}}>
                        <div style={{display:"flex",alignItems:"flex-start",gap:"0.5rem"}}>
                          <span className={`url-preview${row.finalUrl?"":" empty"}`}>
                            {row.finalUrl||"Udfyld platform og kampagnenavn..."}
                          </span>
                          {row.finalUrl&&(
                            <button className="btn-orange" onClick={()=>copySingle(row.finalUrl)}
                              style={{fontSize:"0.65rem",padding:"0.2rem 0.5rem",flexShrink:0}}>
                              Kopiér
                            </button>
                          )}
                        </div>
                      </td>
                      <td className="batch-td"/>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <button className="add-row-btn" onClick={addRow}>+ Tilføj link</button>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState("single");
  return (
    <div style={{minHeight:"100vh",background:"#f5f4f2"}}>
      <div className="page">
        <div style={{marginBottom:"1.5rem"}}>
          <h1 style={{fontSize:"1.5rem",fontWeight:900,color:"#1a1a1a",letterSpacing:"-0.03em"}}>UTM Builder</h1>
          <p style={{fontSize:"0.875rem",color:"#888",marginTop:"0.35rem"}}>Korrekte UTM-parametre til GA4-attribuering</p>
          <div style={{height:"3px",width:"40px",background:O,borderRadius:"2px",marginTop:"0.75rem"}}/>
        </div>

        <div className="card" style={{padding:0,marginBottom:"1rem"}}>
          <div style={{display:"flex",borderBottom:"1.5px solid #f0ede9",padding:"0 1.25rem"}}>
            <button className={`tab-btn ${tab==="single"?"active":"inactive"}`} onClick={()=>setTab("single")}>🔗 Ét link</button>
            <button className={`tab-btn ${tab==="batch"?"active":"inactive"}`} onClick={()=>setTab("batch")}>📊 Batch – flere links</button>
          </div>
          <div style={{padding:"0.65rem 1.25rem",background:"#fafaf9"}}>
            {tab==="single"
              ?<p style={{fontSize:"0.78rem",color:"#666"}}>Generer ét UTM-link – kopier URL'en direkte eller som række til Sheets/Excel.</p>
              :<p style={{fontSize:"0.78rem",color:"#666"}}>Byg en hel kampagne på tværs af platforme. Download som CSV eller kopier alle rækker til Sheets/Excel.</p>
            }
          </div>
        </div>

        {tab==="single"?<SingleMode/>:<BatchMode/>}

        <div style={{background:"#f0f8ff",border:"1px solid #bde0fe",borderRadius:"8px",padding:"0.5rem 0.875rem",marginTop:"0.75rem"}}>
          <p style={{fontSize:"0.72rem",color:"#1a5276",lineHeight:1.5}}>
            <strong>URL-sanitering:</strong> æ→ae · ø→oe · å→aa · mellemrum→underscore · ugyldige tegn fjernes automatisk. UTM-parametre må kun indeholde ASCII-tegn.
          </p>
        </div>

        <div className="footer"><span>calibrate</span> · part of iO</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
