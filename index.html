<head>
  <meta charset="UTF-8"/>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f5f4f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;}
    .header-bar{background:#1a1a1a;padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo-text{font-size:1.4rem;font-weight:900;color:#E8501B;letter-spacing:-0.04em;line-height:1;}
    .logo-sub{font-size:0.58rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.12em;margin-top:1px;}
    .badge-tool{font-size:0.7rem;font-weight:700;color:#E8501B;border:1.5px solid #E8501B;padding:0.2rem 0.6rem;border-radius:4px;text-transform:uppercase;letter-spacing:0.08em;}
    .page{max-width:900px;margin:0 auto;padding:2rem 1rem 3rem;}
    input,select,textarea{font-family:inherit;outline:none;}
    input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px #E8501B;border-color:transparent!important;}
    .inp{width:100%;border:1.5px solid #e2e0dc;border-radius:8px;padding:0.55rem 0.75rem;font-size:0.82rem;color:#1a1a1a;background:white;}
    .inp.warn{border-color:#f59e0b!important;}
    .btn-orange{background:#E8501B;color:white;border:none;border-radius:7px;padding:0.4rem 0.875rem;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 0.15s;}
    .btn-orange:hover{background:#d4451a;}
    .btn-orange:disabled{opacity:0.35;cursor:not-allowed;}
    .btn-outline{background:transparent;color:#E8501B;border:1.5px solid #E8501B;border-radius:7px;padding:0.35rem 0.875rem;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s;}
    .btn-outline:disabled{opacity:0.35;cursor:not-allowed;}
    .btn-outline:hover:not(:disabled){background:#fff0e8;}
    .btn-ghost{background:transparent;color:#888;border:1.5px solid #e8e6e2;border-radius:7px;padding:0.35rem 0.75rem;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}

    .card{background:white;border-radius:12px;border:1.5px solid #e8e6e2;overflow:hidden;margin-bottom:0.75rem;}

    .param-row{display:flex;align-items:center;padding:0.5rem 1rem;border-bottom:1px solid #f5f4f2;}
    .param-row:last-child{border-bottom:none;}
    .footer{text-align:center;margin-top:2rem;font-size:0.7rem;color:#bbb;}
    .footer span{color:#E8501B;font-weight:900;}
    .empty-state{text-align:center;padding:2rem;color:#aaa;font-size:0.875rem;}
    .url-box{background:#f5f4f2;border-radius:8px;padding:0.75rem;word-break:break-all;font-family:monospace;font-size:0.75rem;color:#1a1a1a;line-height:1.6;}
    .ga4-badge{font-size:0.65rem;background:#E8501B;color:white;padding:0.15rem 0.6rem;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
    .warn-box{display:flex;align-items:flex-start;gap:0.5rem;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:0.65rem 0.75rem;margin-top:0.5rem;}
    .warn-box p{font-size:0.75rem;color:#92400e;line-height:1.5;}
    .info-box{display:flex;align-items:flex-start;gap:0.5rem;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:0.65rem 0.75rem;margin-top:0.5rem;}
    .info-box p{font-size:0.75rem;color:#9a3412;line-height:1.5;}
    .sanitize-note{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:0.3rem 0.6rem;font-size:0.7rem;color:#92400e;margin-top:0.3rem;}
    .batch-table{width:100%;border-collapse:collapse;}
    .batch-th{padding:0.4rem 0.5rem;text-align:left;font-size:0.58rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1.5px solid #f0ede9;white-space:nowrap;background:#f0ede9;}
    .batch-td{padding:0.4rem 0.5rem;border-bottom:1px solid #f5f4f2;vertical-align:middle;}
    .batch-tr:last-child .batch-td{border-bottom:none;}
    .batch-tr:hover .batch-td{background:#fafaf9;}
    .url-preview{font-family:monospace;font-size:0.68rem;color:#555;word-break:break-all;line-height:1.4;}

    .add-row-btn{width:100%;padding:0.75rem;background:transparent;color:#E8501B;border:2px dashed #E8501B;border-radius:10px;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:0.75rem;}
    .add-row-btn:hover{background:#fff0e8;}
    .sheets-note{background:#fff0e8;border:1px solid #fdd0b8;border-radius:8px;padding:0.55rem 0.75rem;font-size:0.72rem;color:#9a3412;margin-top:0.5rem;}
    .tpl-card{background:white;border-radius:12px;overflow:hidden;margin-bottom:0.75rem;border:1.5px solid #e8e6e2;transition:border-color 0.15s,box-shadow 0.15s;}
    .tpl-card:hover{border-color:#E8501B44;box-shadow:0 4px 16px rgba(232,80,27,0.08);}
    .tpl-card.builtin{border-left:4px solid #E8501B;}
    .tpl-card.personal{border-left:4px solid #22c55e;}
    .tpl-header{padding:0.875rem 1.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;}
    .tpl-name{font-size:0.9rem;font-weight:800;color:#1a1a1a;}
    .tpl-meta{font-size:0.72rem;color:#888;margin-top:2px;}
    .tpl-rows-preview{padding:0 1.25rem 0.875rem;}
    .tpl-row-chip{display:inline-flex;align-items:center;gap:0.3rem;background:#f5f4f2;border-radius:4px;padding:0.15rem 0.45rem;font-size:0.68rem;font-family:monospace;color:#555;margin:0.15rem;}
    .tpl-actions{display:flex;gap:0.4rem;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
    .new-tpl-form{background:#fafaf9;border-radius:12px;border:1.5px dashed #e8e6e2;padding:1.25rem;margin-bottom:0.75rem;}
    .tpl-row-editor{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr 28px;gap:0.4rem;align-items:center;padding:0.35rem 0.5rem;}
    .badge-builtin{font-size:0.58rem;font-weight:800;background:#fff0e8;color:#E8501B;padding:0.1rem 0.4rem;border-radius:3px;text-transform:uppercase;letter-spacing:0.05em;}
    .badge-personal{font-size:0.58rem;font-weight:800;background:#dcfce7;color:#16a34a;padding:0.1rem 0.4rem;border-radius:3px;text-transform:uppercase;letter-spacing:0.05em;}
    .badge-count{font-size:0.62rem;font-weight:700;background:#E8501B22;color:#E8501B;padding:0.1rem 0.4rem;border-radius:3px;}
    .section-divider{display:flex;align-items:center;gap:0.75rem;margin:1.25rem 0 0.75rem;}
    .section-divider-line{flex:1;height:1px;background:#e8e6e2;}
    .section-divider-label{font-size:0.62rem;font-weight:800;color:#bbb;text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap;}
    .success-toast{background:#dcfce7;color:#16a34a;border-radius:8px;padding:0.6rem 0.875rem;margin-bottom:0.75rem;font-size:0.78rem;font-weight:700;}
  </style>
</head>
<body>
<div class="header-bar">
  <div><div class="logo-text">calibrate</div><div class="logo-sub">part of iO</div></div>
  <div class="badge-tool">UTM Builder</div>
</div>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const O = "#E8501B";
const LS_KEY = "utm_builder_templates";

function sanitize(str){
  return(str||"").toLowerCase()
    .replace(/æ/g,"ae").replace(/ø/g,"oe").replace(/å/g,"aa")
    .replace(/\s+/g,"_").replace(/[^a-z0-9_\-.]/g,"");
}
function hasInvalidChars(str){return /[æøåÆØÅ\s]/.test(str);}

const PLATFORMS=[  {group:"Paid Social",id:"meta",label:"Meta · Paid Social",source:"meta",medium:"paid_social",extraParams:{platform:"{{site_source_name}}",placement:"{{placement}}"},dynamicNote:"Indsæt URL'en i Meta's 'URL Parameters' felt – Meta udfylder platform og placement automatisk per annonce",ga4Channel:"Paid Social",ga4Fix:"Tilføj 'meta' til Paid Social regel i GA4: source matches regex ^(fb|ig|an|facebook|instagram|meta)$"},  {group:"Paid Social",id:"linkedin",label:"LinkedIn · Paid Social",source:"linkedin",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Social",id:"tiktok",label:"TikTok · Paid Social",source:"tiktok",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Social",id:"pinterest",label:"Pinterest · Paid Social",source:"pinterest",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Social",id:"snapchat",label:"Snapchat · Paid Social",source:"snapchat",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Social",id:"twitter",label:"X (Twitter) · Paid Social",source:"twitter",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Social",id:"reddit",label:"Reddit · Paid Social",source:"reddit",medium:"paid_social",ga4Channel:"Paid Social"},  {group:"Paid Search",id:"bing",label:"Microsoft Ads · CPC",source:"bing",medium:"cpc",ga4Channel:"Paid Search"},  {group:"Display",id:"dv360",label:"DV360 · Display",source:"dv360",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"adform",label:"Adform · Display",source:"adform",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"adnami",label:"Adnami · Display",source:"adnami",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"amazon_display",label:"Amazon · Display",source:"amazon",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"targeted_display",label:"Targeted · Display",source:"targeted",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"tv2_display",label:"TV2 · Display",source:"tv2",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"tv2play_display",label:"TV2 Play · Display",source:"tv2play",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"eb_display",label:"Ekstra Bladet · Display",source:"eb",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"bt_display",label:"BT · Display",source:"bt",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"politiken_display",label:"Politiken · Display",source:"politiken",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"berlingske_display",label:"Berlingske · Display",source:"berlingske",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"dba_display",label:"DBA · Display",source:"dba",medium:"display",ga4Channel:"Display"},  {group:"Display",id:"step_network",label:"STEP Network · Display",source:"step_network",medium:"display",ga4Channel:"Display"},  {group:"Native",id:"strossle",label:"Strossle · Native",source:"strossle",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"concept",label:"Concept X · Native",source:"concept",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"tv2_native",label:"TV2 · Native",source:"tv2",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"tv2play_native",label:"TV2 Play · Native",source:"tv2play",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"eb_native",label:"Ekstra Bladet · Native",source:"eb",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"bt_native",label:"BT · Native",source:"bt",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Native",id:"dba_native",label:"DBA · Native",source:"dba",medium:"native",ga4Channel:"Native Advertising",ga4Fix:"Custom channel group nødvendig: medium exactly matches native"},  {group:"Paid Video",id:"youtube",label:"YouTube · Paid Video",source:"youtube",medium:"paid_video",ga4Channel:"Paid Video"},  {group:"Paid Video",id:"eb_video",label:"Ekstra Bladet · Paid Video",source:"eb",medium:"paid_video",ga4Channel:"Paid Video"},  {group:"Paid Video",id:"showheros",label:"ShowHeroes · Paid Video",source:"showheros",medium:"paid_video",ga4Channel:"Paid Video"},  {group:"Audio",id:"spotify",label:"Spotify · Audio",source:"spotify",medium:"audio",ga4Channel:"Audio",ga4Fix:"Custom channel group nødvendig: medium exactly matches audio"},  {group:"Audio",id:"podcast",label:"Podcast · Audio",source:"podcast",medium:"audio",ga4Channel:"Audio",ga4Fix:"Custom channel group nødvendig: medium exactly matches audio"},  {group:"Email",id:"klaviyo",label:"Klaviyo · Email",source:"klaviyo",medium:"email",ga4Channel:"Email"},  {group:"Email",id:"hubspot",label:"HubSpot · Email",source:"hubspot",medium:"email",ga4Channel:"Email"},  {group:"Email",id:"activecampaign",label:"ActiveCampaign · Email",source:"activecampaign",medium:"email",ga4Channel:"Email"},  {group:"Email",id:"newsletter",label:"Nyhedsbrev · Email",source:"newsletter",medium:"email",ga4Channel:"Email"},  {group:"AI",id:"openai",label:"OpenAI · AI",source:"openai",medium:"ai",ga4Channel:"Unassigned",ga4Fix:"Custom channel group nødvendig i GA4: source exactly matches openai AND medium exactly matches ai"},  {group:"Offline",id:"qr",label:"QR-kode · Offline",source:"qr",medium:"offline",ga4Channel:"Offline",ga4Fix:"Custom channel group nødvendig: medium exactly matches offline"},  {group:"Offline",id:"ooh",label:"OOH / DOOH · Offline",source:"ooh",medium:"offline",ga4Channel:"Offline",ga4Fix:"Custom channel group nødvendig: medium exactly matches offline"},];
const GROUPS={};
PLATFORMS.forEach(p=>{if(!GROUPS[p.group])GROUPS[p.group]=[];GROUPS[p.group].push(p);});

// ─── BUILT-IN TEMPLATES ───────────────────────────────────────────────────────
const BUILTIN_TEMPLATES=[  {    id:"hn_uge_katalog",    name:"Harald Nyborg · Uge-katalog",    description:"Standard mediemix til ugekatalog-kampagner",    builtin:true,    rows:[      {platformId:"concept",      url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"display",term:""},      {platformId:"eb_display",   url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"wallpaper",term:""},      {platformId:"tv2_display",  url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"pausead",term:""},      {platformId:"dba_display",  url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"wallpaper",term:""},      {platformId:"showheros",    url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"wallpaper",term:""},      {platformId:"dv360",        url:"https://publikationer.herald-nyborg.dk/uge/",campaign:"uge_katalog",content:"",term:""},      {platformId:"adform",       url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"uge",term:""},      {platformId:"meta",         url:"https://publikationer.harald-nyborg.dk/uge/",campaign:"uge_katalog",content:"",term:""},    ]
  },
];

function buildUrl(baseUrl,platform,campaign,content,term){
  if(!baseUrl||!platform)return"";
  try{
    const clean=baseUrl.trim();
    const sep=clean.includes("?")?"&":"?";
    const params={utm_source:platform.source,utm_medium:platform.medium};
    if(campaign)params.utm_campaign=sanitize(campaign);
    if(content) params.utm_content=sanitize(content);
    if(term)    params.utm_term=sanitize(term);
    if(platform.extraParams)Object.assign(params,platform.extraParams);
    const str=Object.entries(params).map(([k,v])=>v&&v.includes("{{")?`${k}=${v}`:`${k}=${encodeURIComponent(v)}`).join("&");
    return clean+sep+str;
  }catch{return baseUrl;}
}

function PlatformSelect({value,onChange,style}){
  return(
    <select className="inp" value={value} onChange={e=>onChange(e.target.value)} style={style}>
      {Object.entries(GROUPS).map(([group,items])=>(
        <optgroup key={group} label={group}>
          {items.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
        </optgroup>
      ))}
    </select>
  );
}

function SanitizedInput({value,onChange,placeholder,style}){
  const warn=hasInvalidChars(value);
  return(
    <div>
      <input className={`inp${warn?" warn":""}`} type="text" value={value}
        style={style} placeholder={placeholder}
        onChange={e=>onChange(sanitize(e.target.value))}/>
      {warn&&<div className="sanitize-note">æ→ae · ø→oe · å→aa · mellemrum→_</div>}
    </div>
  );
}

function loadPersonalTemplates(){
  try{const raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):[];}catch{return[];}
}
function savePersonalTemplates(t){
  try{localStorage.setItem(LS_KEY,JSON.stringify(t));}catch{}
}

function rowToTabStr(url,platform,campaign,content,term,finalUrl){
  return[url,platform.source,platform.medium,sanitize(campaign),sanitize(content),sanitize(term),finalUrl].join("\t");
}

// ─── SINGLE MODE ─────────────────────────────────────────────────────────────
function SingleMode(){
  const [url,setUrl]=useState("");
  const [platformId,setPlatformId]=useState("meta");
  const [campaign,setCampaign]=useState("");
  const [content,setContent]=useState("");
  const [term,setTerm]=useState("");
  const [copiedUrl,setCopiedUrl]=useState(false);
  const [copiedSheet,setCopiedSheet]=useState(false);

  const platform=PLATFORMS.find(p=>p.id===platformId);
  const finalUrl=useMemo(()=>buildUrl(url,platform,campaign,content,term),[url,platform,campaign,content,term]);
  const hasOutput=url.trim().length>0&&platform;

  const utmParams=useMemo(()=>{
    if(!platform)return{};
    const p={utm_source:platform.source,utm_medium:platform.medium};
    if(campaign)p.utm_campaign=sanitize(campaign);
    if(content) p.utm_content=sanitize(content);
    if(term)    p.utm_term=sanitize(term);
    if(platform.extraParams)Object.assign(p,platform.extraParams);
    return p;
  },[platform,campaign,content,term]);

  const copyUrl=()=>{
    if(!finalUrl)return;
    navigator.clipboard.writeText(finalUrl).then(()=>{setCopiedUrl(true);setTimeout(()=>setCopiedUrl(false),2000);});
  };

  const copyForSheet=()=>{
    if(!finalUrl)return;
    const row=rowToTabStr(url.trim(),platform,campaign,content,term,finalUrl);
    navigator.clipboard.writeText(row).then(()=>{setCopiedSheet(true);setTimeout(()=>setCopiedSheet(false),2500);});
  };

  return(
    <div>
      <div className="card">
        <div style={{padding:"1.25rem"}}>
          <div style={{marginBottom:"1rem"}}>
            <label className="label">Landing Page URL</label>
            <input className="inp" type="text" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://www.harold-nyborg.dk/haven"/>
          </div>
          <div style={{marginBottom:"1rem"}}>
            <label className="label">Platform</label>
            <PlatformSelect value={platformId} onChange={id=>{setPlatformId(id);setCampaign("");setContent("");setTerm("");}}/>
          </div>
          <div style={{marginBottom:"0.75rem"}}>
            <label className="label">Kampagnenavn</label>
            <SanitizedInput value={campaign} onChange={setCampaign} placeholder="e.g. sommerkampagne_2025"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem"}}>
            <div><label className="label">Content</label><SanitizedInput value={content} onChange={setContent} placeholder="e.g. banner_v1"/></div>
            <div><label className="label">Term</label><SanitizedInput value={term} onChange={setTerm} placeholder="e.g. keyword"/></div>
          </div>
        </div>
      </div>

      {hasOutput&&<>
        <div className="card" style={{padding:"1rem"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.625rem",flexWrap:"wrap",gap:"0.5rem"}}>
            <span style={{fontSize:"0.65rem",fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:"0.08em"}}>Genereret URL</span>
            <div style={{display:"flex",gap:"0.4rem"}}>
              <button className="btn-outline" onClick={copyForSheet}>{copiedSheet?"✓ Klar til Sheets!":"📋 Kopiér til Sheets"}</button>
              <button className="btn-orange" onClick={copyUrl} style={{background:copiedUrl?"#dcfce7":O,color:copiedUrl?"#16a34a":"white"}}>{copiedUrl?"✓ Kopieret!":"Kopiér URL"}</button>
            </div>
          </div>
          <div className="url-box">{finalUrl}</div>
          {copiedSheet&&<div className="sheets-note">Paste direkte i Google Sheets – kolonner: URL · utm_source · utm_medium · utm_campaign · utm_content · utm_term · Genereret URL</div>}
        </div>
        <div className="card" style={{overflow:"hidden",marginBottom:"0.75rem"}}>
          <div style={{padding:"0.5rem 1rem",background:"#f5f4f2",borderBottom:"1px solid #f0ede9"}}>
            <span style={{fontSize:"0.65rem",fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:"0.08em"}}>Parametre</span>
          </div>
          {Object.entries(utmParams).map(([key,value])=>{
            const isDynamic=value&&value.includes("{{");
            const isExtra=platform?.extraParams&&key in platform.extraParams;
            return(
              <div key={key} className="param-row">
                <span style={{fontFamily:"monospace",fontSize:"0.75rem",width:"9rem",flexShrink:0,color:isExtra?"#aaa":O}}>{key}</span>
                <span style={{fontFamily:"monospace",fontSize:"0.75rem",color:isDynamic?"#f59e0b":"#1a1a1a"}}>{value}</span>
                {isDynamic&&<span style={{marginLeft:"0.5rem",fontSize:"0.62rem",background:"#fffbeb",color:"#f59e0b",border:"1px solid #fde68a",padding:"0.1rem 0.35rem",borderRadius:"3px",fontWeight:700}}>auto</span>}
              </div>
            );
          })}
        </div>
        <div className="card" style={{padding:"1rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:(platform.dynamicNote||platform.ga4Fix)?"0.625rem":0}}>
            <span className="ga4-badge">GA4</span>
            <span style={{fontSize:"0.875rem",color:"#1a1a1a",fontWeight:500}}>{platform.ga4Channel}</span>
          </div>
          {platform.dynamicNote&&<div className="warn-box"><span style={{color:"#f59e0b",flexShrink:0}}>⚡</span><p>{platform.dynamicNote}</p></div>}
          {platform.ga4Fix&&<div className="info-box"><span style={{color:"#f97316",flexShrink:0}}>⚠</span><p>{platform.ga4Fix}</p></div>}
        </div>
      </>}
      {!hasOutput&&<div className="card" style={{border:"1.5px dashed #e8e6e2"}}><div className="empty-state">Indtast en URL for at generere dit UTM-link</div></div>}
    </div>
  );
}

// ─── BATCH MODE ───────────────────────────────────────────────────────────────
let batchId=1;
function newBatchRow(pid="meta"){return{id:batchId++,platformId:pid,url:"",campaign:"",content:"",term:""};}

function BatchMode({pendingRows,onPendingConsumed,onSaveAsTemplate}){
  const [rows,setRows]=useState([newBatchRow("meta"),newBatchRow("linkedin"),newBatchRow("tiktok")]);
  const [copiedAll,setCopiedAll]=useState(false);
  const [downloaded,setDownloaded]=useState(false);

  useEffect(()=>{
    if(pendingRows&&pendingRows.length>0){
      setRows(pendingRows.map(r=>({...r,id:batchId++})));
      onPendingConsumed();
    }
  },[pendingRows]);

  const updRow=(id,f,v)=>setRows(prev=>prev.map(r=>r.id===id?{...r,[f]:v}:r));
  const remRow=(id)=>setRows(prev=>prev.filter(r=>r.id!==id));
  const addRow=()=>setRows(prev=>[...prev,newBatchRow("meta")]);

  const builtRows=useMemo(()=>rows.map(r=>{
    const p=PLATFORMS.find(x=>x.id===r.platformId);
    return{...r,platform:p,finalUrl:buildUrl(r.url,p,r.campaign,r.content,r.term)};
  }),[rows]);

  const validRows=builtRows.filter(r=>r.url&&r.finalUrl);

  const copyAllForSheets=()=>{
    const dataRows=builtRows.map(r=>{
      if(!r.url||!r.platform)return null;
      return rowToTabStr(r.url,r.platform,r.campaign,r.content,r.term,r.finalUrl);
    }).filter(Boolean);
    navigator.clipboard.writeText(dataRows.join("\n")).then(()=>{setCopiedAll(true);setTimeout(()=>setCopiedAll(false),2500);});
  };

  const downloadCsv=()=>{
    const header="Landing Page URL,utm_source,utm_medium,utm_campaign,utm_content,utm_term,Genereret URL";
    const dataRows=builtRows.map(r=>{
      if(!r.url||!r.platform)return null;
      return[r.url,r.platform.source,r.platform.medium,sanitize(r.campaign),sanitize(r.content),sanitize(r.term),r.finalUrl]
        .map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(",");
    }).filter(Boolean);
    const csv=[header,...dataRows].join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="utm-links.csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    setDownloaded(true);setTimeout(()=>setDownloaded(false),2000);
  };

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.75rem",flexWrap:"wrap",gap:"0.5rem"}}>
        <p style={{fontSize:"0.8rem",color:"#888"}}>{validRows.length} af {rows.length} links klar</p>
        <div style={{display:"flex",gap:"0.4rem",flexWrap:"wrap"}}>
          <button className="btn-ghost" onClick={()=>onSaveAsTemplate(rows)} disabled={validRows.length===0} style={{fontSize:"0.72rem"}}>💾 Gem som skabelon</button>
          <button className="btn-outline" onClick={copyAllForSheets} disabled={validRows.length===0}>{copiedAll?"✓ Klar til Sheets!":"📋 Kopiér alle til Sheets"}</button>
          <button className="btn-orange" onClick={downloadCsv} disabled={validRows.length===0}
            style={{background:downloaded?"#dcfce7":O,color:downloaded?"#16a34a":"white"}}>
            {downloaded?"✓ Downloadet!":"⬇ Download CSV"}
          </button>
        </div>
      </div>
      {copiedAll&&<div className="sheets-note" style={{marginBottom:"0.75rem"}}>Paste direkte i Google Sheets – kolonner: URL · utm_source · utm_medium · utm_campaign · utm_content · utm_term · Genereret URL</div>}

      <div className="card">
        <div style={{overflowX:"auto"}}>
          <table className="batch-table">
            <thead>
              <tr>
                <th className="batch-th">Landing Page URL</th>
                <th className="batch-th">Platform</th>
                <th className="batch-th">Kampagnenavn</th>
                <th className="batch-th">Content</th>
                <th className="batch-th">Term</th>
                <th className="batch-th" style={{width:"28px"}}></th>
              </tr>
            </thead>
            <tbody>
              {builtRows.map(row=>(
                <React.Fragment key={row.id}>
                  <tr className="batch-tr">
                    <td className="batch-td"><input className="inp" type="text" value={row.url} onChange={e=>updRow(row.id,"url",e.target.value)} placeholder="https://..." style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/></td>
                    <td className="batch-td"><PlatformSelect value={row.platformId} onChange={v=>updRow(row.id,"platformId",v)} style={{fontSize:"0.75rem",padding:"0.38rem 0.55rem"}}/></td>
                    <td className="batch-td"><input className={`inp${hasInvalidChars(row.campaign)?" warn":""}`} type="text" value={row.campaign} onChange={e=>updRow(row.id,"campaign",sanitize(e.target.value))} placeholder="sommerkampagne" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/></td>
                    <td className="batch-td"><input className={`inp${hasInvalidChars(row.content)?" warn":""}`} type="text" value={row.content} onChange={e=>updRow(row.id,"content",sanitize(e.target.value))} placeholder="banner_v1" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/></td>
                    <td className="batch-td"><input className={`inp${hasInvalidChars(row.term)?" warn":""}`} type="text" value={row.term} onChange={e=>updRow(row.id,"term",sanitize(e.target.value))} placeholder="keyword" style={{fontSize:"0.78rem",padding:"0.38rem 0.55rem"}}/></td>
                    <td className="batch-td"><button className="remove-btn" onClick={()=>remRow(row.id)}>×</button></td>
                  </tr>
                  {row.url&&(
                    <tr className="batch-tr">
                      <td className="batch-td" colSpan={5} style={{paddingTop:"0.15rem",paddingBottom:"0.5rem"}}>
                        <div style={{display:"flex",alignItems:"flex-start",gap:"0.5rem"}}>
                          <span className={`url-preview${row.finalUrl?"":" empty"}`}>{row.finalUrl||"Udfyld platform og kampagnenavn..."}</span>
                          {row.finalUrl&&<button className="btn-orange" onClick={()=>navigator.clipboard.writeText(row.finalUrl)} style={{fontSize:"0.65rem",padding:"0.2rem 0.5rem",flexShrink:0}}>Kopiér</button>}
                        </div>
                      </td>
                      <td className="batch-td"/>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <button className="add-row-btn" onClick={addRow}>+ Tilføj link</button>
    </div>
  );
}

// ─── TEMPLATES MODE ───────────────────────────────────────────────────────────
let tplRowId=1;
function newTplRow(){return{id:tplRowId++,platformId:"meta",url:"",campaign:"",content:"",term:""};}

function TemplatesMode({personalTemplates,setPersonalTemplates,onLoadToBatch}){
  const [showNew,setShowNew]=useState(false);
  const [newName,setNewName]=useState("");
  const [newDesc,setNewDesc]=useState("");
  const [newRows,setNewRows]=useState([newTplRow()]);
  const [toast,setToast]=useState(null);
  const [confirmDelete,setConfirmDelete]=useState(null);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),2500);};
  const addTplRow=()=>setNewRows(r=>[...r,newTplRow()]);
  const updTplRow=(id,f,v)=>setNewRows(r=>r.map(x=>x.id===id?{...x,[f]:v}:x));
  const remTplRow=(id)=>setNewRows(r=>r.filter(x=>x.id!==id));

  const saveTemplate=()=>{
    if(!newName.trim())return;
    const tpl={id:"personal_"+Date.now(),name:newName,description:newDesc,builtin:false,rows:newRows.filter(r=>r.url||r.platformId)};
    const updated=[...personalTemplates,tpl];
    setPersonalTemplates(updated);savePersonalTemplates(updated);
    setNewName("");setNewDesc("");setNewRows([newTplRow()]);setShowNew(false);
    showToast(`✓ "${newName}" er gemt`);
  };

  const deleteTemplate=(id)=>{
    const updated=personalTemplates.filter(t=>t.id!==id);
    setPersonalTemplates(updated);savePersonalTemplates(updated);
    setConfirmDelete(null);showToast("Skabelon slettet");
  };

  const exportTemplates=()=>{
    const blob=new Blob([JSON.stringify(personalTemplates,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="utm-skabeloner.json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  const importTemplates=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const imported=JSON.parse(ev.target.result);
        if(Array.isArray(imported)){
          const merged=[...personalTemplates,...imported.filter(t=>!personalTemplates.find(p=>p.id===t.id))];
          setPersonalTemplates(merged);savePersonalTemplates(merged);
          showToast(`✓ ${imported.length} skabelon${imported.length!==1?"er":""} importeret`);
        }
      }catch{showToast("Fejl – tjek at filen er gyldig JSON");}
    };
    reader.readAsText(file);e.target.value="";
  };

  return(
    <div>
      {toast&&<div className="success-toast">{toast}</div>}
      {confirmDelete&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
          <div style={{background:"white",borderRadius:"12px",padding:"1.25rem",maxWidth:"380px",width:"100%"}}>
            <p style={{fontWeight:700,marginBottom:"0.5rem"}}>Slet skabelon?</p>
            <p style={{fontSize:"0.8rem",color:"#888",marginBottom:"1rem"}}>"{confirmDelete.name}" slettes permanent fra din browser.</p>
            <div style={{display:"flex",gap:"0.5rem",justifyContent:"flex-end"}}>
              <button className="btn-ghost" onClick={()=>setConfirmDelete(null)}>Annullér</button>
              <button className="btn-danger" onClick={()=>deleteTemplate(confirmDelete.id)}>Slet</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.75rem",flexWrap:"wrap",gap:"0.5rem"}}>
        <p style={{fontSize:"0.8rem",color:"#888"}}>{BUILTIN_TEMPLATES.length} fælles · {personalTemplates.length} personlige</p>
        <div style={{display:"flex",gap:"0.4rem",flexWrap:"wrap"}}>
          {personalTemplates.length>0&&<button className="btn-ghost" onClick={exportTemplates} style={{fontSize:"0.72rem"}}>⬇ Eksportér JSON</button>}
          <label className="btn-ghost" style={{fontSize:"0.72rem",cursor:"pointer"}}>
            ↑ Importér JSON
            <input type="file" accept=".json" style={{display:"none"}} onChange={importTemplates}/>
          </label>
          <button className="btn-outline" onClick={()=>setShowNew(!showNew)}>{showNew?"✕ Annullér":"+ Ny skabelon"}</button>
        </div>
      </div>

      {showNew&&(
        <div className="new-tpl-form">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem",marginBottom:"0.75rem"}}>
            <div><label className="label">Navn *</label><input className="inp" type="text" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="f.eks. Imerco · Display-mix"/></div>
            <div><label className="label">Beskrivelse</label><input className="inp" type="text" value={newDesc} onChange={e=>setNewDesc(e.target.value)} placeholder="Valgfri"/></div>
          </div>
          <label className="label" style={{marginBottom:"0.5rem"}}>Links</label>
          <div style={{background:"white",borderRadius:"8px",border:"1.5px solid #e8e6e2",overflow:"hidden",marginBottom:"0.5rem"}}>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 1fr 1fr 28px",gap:"0.4rem",padding:"0.35rem 0.5rem",background:"#f0ede9",borderBottom:"1px solid #e8e6e2"}}>
              {["URL","Platform","Kampagnenavn","Content","Term",""].map((l,i)=><span key={i} style={{fontSize:"0.58rem",fontWeight:800,color:"#aaa",textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</span>)}
            </div>
            {newRows.map((row,i)=>(
              <div key={row.id} className="tpl-row-editor" style={{borderBottom:i<newRows.length-1?"1px solid #f5f4f2":"none"}}>
                <input className="inp" type="text" value={row.url} onChange={e=>updTplRow(row.id,"url",e.target.value)} placeholder="https://..." style={{fontSize:"0.75rem",padding:"0.35rem 0.5rem"}}/>
                <PlatformSelect value={row.platformId} onChange={v=>updTplRow(row.id,"platformId",v)} style={{fontSize:"0.72rem",padding:"0.35rem 0.5rem"}}/>
                <input className="inp" type="text" value={row.campaign} onChange={e=>updTplRow(row.id,"campaign",sanitize(e.target.value))} placeholder="kampagne" style={{fontSize:"0.75rem",padding:"0.35rem 0.5rem"}}/>
                <input className="inp" type="text" value={row.content} onChange={e=>updTplRow(row.id,"content",sanitize(e.target.value))} placeholder="content" style={{fontSize:"0.75rem",padding:"0.35rem 0.5rem"}}/>
                <input className="inp" type="text" value={row.term} onChange={e=>updTplRow(row.id,"term",sanitize(e.target.value))} placeholder="term" style={{fontSize:"0.75rem",padding:"0.35rem 0.5rem"}}/>
                <button className="remove-btn" onClick={()=>remTplRow(row.id)}>×</button>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:"0.5rem"}}>
            <button className="btn-ghost" onClick={addTplRow}>+ Tilføj række</button>
            <button className="btn-orange" onClick={saveTemplate} disabled={!newName.trim()}>Gem skabelon</button>
          </div>
        </div>
      )}

      <div className="section-divider"><div className="section-divider-line"/><span className="section-divider-label">🏢 Fælles skabeloner</span><div className="section-divider-line"/></div>
      {BUILTIN_TEMPLATES.map(tpl=>(
        <div key={tpl.id} className="tpl-card builtin">
          <div className="tpl-header">
            <div>
              <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:"2px"}}>
                <div className="tpl-name">{tpl.name}</div>
                <span className="badge-builtin">Fælles</span>
              </div>
              {tpl.description&&<div className="tpl-meta">{tpl.description}</div>}
              <div style={{marginTop:"3px"}}><span className="badge-count">{tpl.rows.length} links</span></div>
            </div>
            <div className="tpl-actions">
              <button style={{background:O,color:"white",border:"none",borderRadius:"6px",padding:"0.4rem 0.875rem",fontSize:"0.78rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>onLoadToBatch(tpl.rows)}>↗ Indlæs i Batch</button>
            </div>
          </div>
          <div className="tpl-rows-preview">
            {tpl.rows.map((r,i)=>{
              const p=PLATFORMS.find(x=>x.id===r.platformId);
              return(<span key={i} className="tpl-row-chip"><span style={{color:O,fontWeight:700}}>{p?.source||r.platformId}</span>{r.campaign&&<span>· {r.campaign}</span>}{r.content&&<span style={{color:"#aaa"}}>· {r.content}</span>}</span>);
            })}
          </div>
        </div>
      ))}

      <div className="section-divider"><div className="section-divider-line"/><span className="section-divider-label">👤 Mine skabeloner (gemt i din browser)</span><div className="section-divider-line"/></div>
      {personalTemplates.length===0&&(
        <div className="card" style={{border:"1.5px dashed #e8e6e2"}}>
          <div className="empty-state"><p>Ingen personlige skabeloner endnu.</p><p style={{fontSize:"0.75rem",marginTop:"0.35rem"}}>Brug "💾 Gem som skabelon" i Batch, eller opret én ovenfor.</p></div>
        </div>
      )}
      {personalTemplates.map(tpl=>(
        <div key={tpl.id} className="tpl-card personal">
          <div className="tpl-header">
            <div>
              <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:"2px"}}>
                <div className="tpl-name">{tpl.name}</div>
                <span className="badge-personal">Min</span>
              </div>
              {tpl.description&&<div className="tpl-meta">{tpl.description}</div>}
              <div style={{marginTop:"3px"}}><span className="badge-count">{tpl.rows.length} links</span></div>
            </div>
            <div className="tpl-actions">
              <button style={{background:O,color:"white",border:"none",borderRadius:"6px",padding:"0.4rem 0.875rem",fontSize:"0.78rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}} onClick={()=>onLoadToBatch(tpl.rows)}>↗ Indlæs i Batch</button>
              <button className="btn-danger" onClick={()=>setConfirmDelete(tpl)}>Slet</button>
            </div>
          </div>
          <div className="tpl-rows-preview">
            {tpl.rows.map((r,i)=>{
              const p=PLATFORMS.find(x=>x.id===r.platformId);
              return(<span key={i} className="tpl-row-chip"><span style={{color:"#22c55e",fontWeight:700}}>{p?.source||r.platformId}</span>{r.campaign&&<span>· {r.campaign}</span>}{r.content&&<span style={{color:"#aaa"}}>· {r.content}</span>}</span>);
            })}
          </div>
        </div>
      ))}

      <div style={{background:"#f0f8ff",border:"1px solid #bde0fe",borderRadius:"8px",padding:"0.5rem 0.875rem",marginTop:"0.75rem"}}>
        <p style={{fontSize:"0.72rem",color:"#1a5276",lineHeight:1.5}}>
          <strong>Fælles skabeloner</strong> er tilgængelige for alle. <strong>Mine skabeloner</strong> gemmes kun i din browser – brug Eksportér/Importér JSON for at dele med kolleger.
        </p>
      </div>
    </div>
  );
}

              📁 Skabeloner
              <span style={{marginLeft:"0.4rem",fontSize:"0.62rem",fontWeight:700,background:"#E8501B22",color:O,padding:"0.1rem 0.35rem",borderRadius:"3px"}}>
                {BUILTIN_TEMPLATES.length+personalTemplates.length}
              </span>
            </button>
          </div>
          <div style={{padding:"0.65rem 1.25rem",background:"#fafaf9"}}>
            {tab==="single"&&<p style={{fontSize:"0.78rem",color:"#666"}}>Generer ét UTM-link – kopier URL'en direkte eller som række til Sheets/Excel.</p>}
            {tab==="batch"&&<p style={{fontSize:"0.78rem",color:"#666"}}>Byg en hel kampagne på tværs af platforme. Download som CSV eller kopier til Sheets/Excel.</p>}
            {tab==="templates"&&<p style={{fontSize:"0.78rem",color:"#666"}}>Fælles kampagneskabeloner + dine personlige (gemt i denne browser).</p>}
          </div>
        </div>

        {tab==="single"&&<SingleMode/>}
        {tab==="batch"&&<BatchMode pendingRows={pendingRows} onPendingConsumed={()=>setPendingRows(null)} onSaveAsTemplate={handleSaveAsTemplate}/>}
        {tab==="templates"&&<TemplatesMode personalTemplates={personalTemplates} setPersonalTemplates={setPersonalTemplates} onLoadToBatch={handleLoadToBatch}/>}

        <div style={{background:"#f0f8ff",border:"1px solid #bde0fe",borderRadius:"8px",padding:"0.5rem 0.875rem",marginTop:"0.75rem"}}>
          <p style={{fontSize:"0.72rem",color:"#1a5276",lineHeight:1.5}}><strong>URL-sanitering:</strong> æ→ae · ø→oe · å→aa · mellemrum→_ · ugyldige tegn fjernes automatisk.</p>
        </div>
        <div className="footer"><span>calibrate</span> · part of iO</div>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
