<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UTM Builder – Harald Nyborg</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FCED01;
      --yellow-dark: #d9cc00;
      --yellow-glow: rgba(252,237,1,0.25);
      --black: #111111;
      --step: #0057FF;
      --step-dark: #0046cc;
      --step-glow: rgba(0,87,255,0.15);
      --step-light: #EEF4FF;
      --bt: #E8420A;
      --bt-dark: #c23508;
      --bt-glow: rgba(232,66,10,0.15);
      --bt-light: #FFF1EC;
      --gray-50: #fafafa;
      --gray-100: #f4f4f5;
      --gray-200: #e4e4e7;
      --gray-300: #d1d1d6;
      --gray-400: #a1a1aa;
      --gray-500: #71717a;
      --gray-700: #3f3f46;
      --gray-900: #18181b;
      --radius: 10px;
      --radius-sm: 7px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.05);
    }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: #EBEBEB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 72px;
    }

    .page-wrapper { width: 100%; max-width: 920px; }

    /* ─── HEADER ─── */
    .site-header {
      background: var(--black);
      border-radius: 14px 14px 0 0;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      position: relative;
      overflow: hidden;
    }
    .site-header::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: var(--yellow);
      transition: background 0.3s;
    }
    .site-header.is-step::before { background: var(--step); }
    .site-header.is-bt::before   { background: var(--bt); }

    .logo-area { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 40px; height: 40px;
      background: var(--yellow);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .site-header.is-step .logo-mark { background: var(--step); }
    .site-header.is-bt   .logo-mark { background: var(--bt); }
    .site-header.is-step .logo-mark svg,
    .site-header.is-bt   .logo-mark svg { stroke: #fff; }
    .logo-mark svg { width: 22px; height: 22px; }

    .logo-text { display: flex; flex-direction: column; gap: 1px; }
    .logo-name { font-size: 17px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1; }
    .logo-name span { color: var(--yellow); transition: color 0.3s; }
    .site-header.is-step .logo-name span { color: #6aa0ff; }
    .site-header.is-bt   .logo-name span { color: #ff9474; }
    .logo-sub { font-size: 10px; color: var(--gray-400); letter-spacing: 0.5px; font-weight: 500; text-transform: uppercase; }

    .header-tool-label {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      padding: 6px 14px;
    }
    .header-tool-label .dot {
      width: 6px; height: 6px;
      background: var(--yellow);
      border-radius: 50%;
      animation: pulse 2s infinite;
      transition: background 0.3s;
    }
    .site-header.is-step .header-tool-label .dot { background: var(--step); }
    .site-header.is-bt   .header-tool-label .dot { background: var(--bt); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .header-tool-label span { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.4px; text-transform: uppercase; }

    /* ─── CARD ─── */
    .card { background: #fff; border-radius: 0 0 14px 14px; padding: 40px; box-shadow: var(--shadow-lg); }

    /* ─── SECTION TITLES ─── */
    .section-title {
      font-size: 10px; font-weight: 700; color: var(--gray-400);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }

    /* ─── TOGGLE GROUPS ─── */
    .type-toggle-wrap { margin-bottom: 16px; }

    .toggle-groups {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .toggle-group { display: flex; flex-direction: column; gap: 6px; }

    .toggle-group-label {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--gray-400);
      padding-left: 4px;
    }

    .type-toggle {
      display: flex;
      background: var(--gray-100);
      border-radius: var(--radius);
      padding: 5px;
      gap: 4px;
      border: 1.5px solid var(--gray-200);
      width: fit-content;
    }

    .type-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      background: transparent; color: var(--gray-400);
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
    }
    .type-btn svg { transition: opacity 0.2s; opacity: 0.5; }

    .type-btn.active        { background: #fff; color: var(--black); box-shadow: 0 1px 8px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06); }
    .type-btn.active svg    { opacity: 1; }
    .type-btn.active-step   { background: var(--step-light); color: var(--step); box-shadow: 0 1px 8px rgba(0,87,255,0.12); }
    .type-btn.active-step svg { opacity: 1; }
    .type-btn.active-bt     { background: var(--bt-light); color: var(--bt); box-shadow: 0 1px 8px rgba(232,66,10,0.12); }
    .type-btn.active-bt svg { opacity: 1; }

    .type-chip {
      font-size: 9.5px; font-weight: 800;
      padding: 2px 8px; border-radius: 99px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .chip-newsletter { background: var(--yellow); color: var(--black); }
    .chip-flow       { background: var(--black); color: var(--yellow); }
    .chip-step       { background: var(--step); color: #fff; }
    .chip-bt         { background: var(--bt); color: #fff; }

    /* ─── REAID TOGGLE ─── */
    .reaid-toggle-wrap { margin-bottom: 28px; }
    .reaid-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
      gap: 16px;
    }
    .reaid-toggle-row:hover { border-color: var(--gray-300); background: #fff; }
    .reaid-toggle-row.active { border-color: var(--yellow-dark); background: #fffef5; }
    .reaid-toggle-left { display: flex; align-items: center; gap: 10px; }
    .reaid-icon {
      width: 30px; height: 30px;
      background: var(--gray-100); border: 1.5px solid var(--gray-200);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, border-color 0.2s;
    }
    .reaid-toggle-row.active .reaid-icon { background: var(--yellow); border-color: var(--yellow-dark); }
    .reaid-toggle-row.active .reaid-icon svg { stroke: var(--black); }
    .reaid-icon svg { stroke: var(--gray-400); transition: stroke 0.2s; }
    .reaid-text-group { display: flex; flex-direction: column; gap: 2px; }
    .reaid-title { font-size: 12px; font-weight: 700; color: var(--gray-700); }
    .reaid-toggle-row.active .reaid-title { color: var(--gray-900); }
    .reaid-desc { font-size: 11px; color: var(--gray-400); }
    .reaid-desc code {
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 10.5px; background: var(--gray-100);
      border: 1px solid var(--gray-200); border-radius: 4px;
      padding: 1px 5px; color: var(--gray-700);
    }
    .reaid-toggle-row.active .reaid-desc code { background: #fff3b0; border-color: #e8df00; color: #5a5000; }

    .ios-toggle { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .ios-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .ios-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--gray-200); border-radius: 24px;
      border: 1.5px solid var(--gray-300); transition: 0.2s;
    }
    .ios-slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 3px; top: 50%;
      transform: translateY(-50%);
      background: #fff; border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18); transition: 0.2s;
    }
    .ios-toggle input:checked + .ios-slider { background: var(--black); border-color: var(--black); }
    .ios-toggle input:checked + .ios-slider::before { transform: translateY(-50%) translateX(18px); background: var(--yellow); }

    /* ─── FORM ─── */
    .form-grid { display: grid; grid-template
